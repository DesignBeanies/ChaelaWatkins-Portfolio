<svg preserveAspectRatio="xMidYMid meet" width="100%" height="100%" overflow="visible" style="display: block;" viewBox="0 0 570.296 403" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style type="text/css">
    <![CDATA[
      /* Base solid; top fades to a point in the mask. Wobble: faster cycle,
         eases to a pinched “tip” at the mid keyframe, then back. */
      #espresso-steam {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: espresso-steam-breathe 3s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }
      @keyframes espresso-steam-breathe {
        0%,
        100% {
          transform: translateY(0) scaleX(1) scaleY(1);
        }
        /* Rise then settle to a pinched, pointy wisp (narrower = reads as a tip) */
        50% {
          transform: translateY(-4.5px) scaleX(0.82) scaleY(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #espresso-steam {
          animation: none !important;
          mask: none !important;
        }
      }
    ]]>
  </style>
